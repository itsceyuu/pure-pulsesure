# PULSESURE production stack for the organization VM.
# Values written as ${...} are read from the .env file in the same folder
# (copy it from .env.example).
# Start from the repository root:
#   docker compose -f docker-compose.prod.yml up -d --build
name: pulsesure-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports": the database is only reachable from inside the Docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build: ./apps/ai-service
    restart: unless-stopped
    environment:
      MODEL_VERSION: ${MODEL_VERSION}
    # Not published: only the backend calls it.

  backend:
    build: ./apps/backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      AI_SERVICE_URL: http://ai:8000
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
